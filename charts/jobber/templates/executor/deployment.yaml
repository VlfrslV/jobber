{{- if .Values.executor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  labels:
    app: executor
spec:
  replicas: {{ .Values.executor.replicas }}
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      containers:
        - name: executor
          image: {{ .Values.executor.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.executor.port }}
          env:
            - name: PORT
              value: {{ .Values.executor.port | quote }}
            - name: PRODUCTS_GRPC_SERVICE_URL
              value: "products-grpc:{{ .Values.products.port.grpc }}"
{{ include "jobber.env" . | nindent 12 }}
{{- end }}
